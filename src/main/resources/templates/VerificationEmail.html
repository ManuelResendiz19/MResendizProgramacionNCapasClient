<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body layout:fragment="body">

<div class="container">
    <div class="row justify-content-center align-items-center" style="height: 80vh;">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4 animate__animated animate__fadeInDown">
                
                <!-- Card Header -->
                <div class="card-header text-center bg-primary text-white rounded-top-4">
                    <h4 class="mb-0">
                        <i class="bi bi-envelope-check-fill"></i> Verifica tu correo
                    </h4>
                </div>

                <!-- Card Body -->
                <div class="card-body text-center">
                    <p class="card-text fs-6 mb-4">
                        Para continuar, necesitamos que verifiques tu correo electrónico.
                    </p>
                    
                    <!-- Mensaje dinámico opcional -->
                    <p class="text-muted mb-4" th:text="${emailMessage}"></p>

                    <!-- Botón de verificación -->
                    <a th:href="@{'/api/email/verification'(token=${token})}"" 
                       class="btn btn-success btn-lg rounded-pill px-5">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        Verificar correo
                    </a>
                </div>

                <!-- Card Footer -->
                <div class="card-footer text-center text-muted small rounded-bottom-4">
                    ¿No recibiste el correo? Revisa tu bandeja de spam o solicita uno nuevo.
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
