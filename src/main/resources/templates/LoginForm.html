<html  xmlns:th="http://www.thymeleaf.org"
       xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
       layout:decorate="~{layout}">
    <!--    <head>
            <title>TODO supply a title</title>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
        </head>-->
    <body layout:fragment="body" class="bg-light">
        <div class="container d-flex justify-content-center align-items-center vh-100">
            <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px; border-radius: 10px;">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">Iniciar Sesión</h3>
                    <p class="text-muted">Ingresa tu usuario y contraseña</p>
                </div>

                <form id="loginForm" th:action="@{/usuario/login}" method="post" th:object="${loginRequest}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required th:field="*{username}">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required th:field="*{password}">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
                    </div>
                </form>


            </div>
        </div>

        <style>
            body {
                background-color: #f8f9fa;
            }
            .card {
                background-color: #fff;
                transition: transform 0.2s;
            }
            .card:hover {
                transform: translateY(-5px);
            }
            .btn-primary {
                background-color: #0d6efd;
                border: none;
            }
            .btn-primary:hover {
                background-color: #0b5ed7;
            }
        </style>


    </body>
</html>
